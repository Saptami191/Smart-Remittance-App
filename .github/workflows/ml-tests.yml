name: ML Service Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-ml-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ml_service/requirements.txt pytest httpx

      - name: Run ML service tests
        run: pytest -q ml_service/test_forecast_service.py
