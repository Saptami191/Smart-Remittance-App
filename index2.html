<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockVerse - Login / Signup</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
  <div class="background-animation"></div>

  <div class="card">
    <div class="toggle">
      <button id="loginToggle" class="active">Login</button>
      <button id="signupToggle">Sign Up</button>
    </div>

    <form id="loginForm" class="form active-form">
      <h2>Welcome Back 👋</h2>
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <form id="signupForm" class="form">
      <h2>Create an Account 🚀</h2>
      <input type="text" placeholder="Username" required />
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    const loginToggle = document.getElementById('loginToggle');
    const signupToggle = document.getElementById('signupToggle');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    // Toggle logic
    loginToggle.addEventListener('click', () => {
      loginForm.classList.add('active-form');
      signupForm.classList.remove('active-form');
      loginToggle.classList.add('active');
      signupToggle.classList.remove('active');
    });

    signupToggle.addEventListener('click', () => {
      signupForm.classList.add('active-form');
      loginForm.classList.remove('active-form');
      signupToggle.classList.add('active');
      loginToggle.classList.remove('active');
    });

    // Login logic
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target[0].value;
      const password = e.target[1].value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          window.location.href = '/dashboard.html';
        } else {
          alert('Login failed: ' + (data.error || 'Server error'));
        }
      } catch (err) {
        alert('Fetch error: ' + err.message);
      }
    });

    // Signup logic
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = e.target[0].value;
      const email = e.target[1].value;
      const password = e.target[2].value;

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        
        if (data.userId) {
          alert('Signup successful! Please login.');
          loginToggle.click(); // Switch to login form
        } else {
          alert('Signup failed: ' + (data.error || 'Server error'));
        }
      } catch (err) {
        alert('Fetch error: ' + err.message);
      }
    });
  </script>
 
  
</body>
</html>
