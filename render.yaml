services:
  - type: web
    name: smartremit-ml
    runtime: python
    rootDir: ml_service
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python ingest_fx_data.py --base USD --symbol INR --start 2021-01-01 --output ../data/raw/forex_rates.csv &&
      python train_forecast.py --data ../data/raw/forex_rates.csv --from-currency USD --to-currency INR
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: smartremit-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: smartremit-ml
          property: hostport
